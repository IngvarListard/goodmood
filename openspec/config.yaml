schema: spec-driven

rules:
  proposal:
    - Всегда заполняй Scope и Non-goals.
    - Противоречие требований — подними вопрос человеку.
    - Отвечай на русском языке.
    - Используй Hiccup v2, классы DaisyUI передавай вектором или строкой, а атрибуты HTMX (например, :hx-get, :hx-target) клади в мапу параметров
  specs:
    - Если описание в _raw расходится с кодом — верь коду. Используй Given/When/Then.
  design:
    - Опирайся на инварианты из 03-architecture.md и релевантные ADR.
  tasks:
    - Не делай refactor вне задачи;
    - Запускай тесты после выполнения задачи. Тесты должны проходить;
    - Запускай приложение после выполнения задачи. Приложение должно корректно запускаться.
  context:
    - Для работы с иконками используй инструкции 20-icons.md
#  deprecated из 07-anti-patterns.md запрещены.


# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
