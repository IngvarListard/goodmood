<html class="scroll-smooth" data-theme="dark" lang="ru"><head><meta charset="utf-8" /><meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" /><title>Hiccup Preview</title><link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" /><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@1.9.12"></script><script src="https://unpkg.com/hyperscript.org@0.9.12"></script></head><body class="min-h-screen bg-base-200"><div><h3 class="text-lg font-semibold mb-4">Новый медикамент</h3><form _="on htmx:afterRequest
               if event.detail.successful
                 call #med-modal.close()
               end" hx-ext="json-enc" hx-post="/medications" hx-swap="outerHTML" hx-target="#med-list"><input name="__anti-forgery-token" type="hidden" value="CSRF" /><div class="form-control mb-4"><label class="label"><span class="label-text text-base font-medium">Название</span></label><input class="input input-bordered w-full h-12" name="name" placeholder="Препарат А" required="required" type="text" /></div><div class="flex gap-2 mb-4"><div class="form-control flex-1"><label class="label"><span class="label-text text-base font-medium">Доза</span></label><input class="input input-bordered w-full h-12" min="0" name="dose" placeholder="600" required="required" step="0.5" type="number" /></div><div class="form-control w-28"><label class="label"><span class="label-text text-base font-medium">Единица</span></label><select class="select select-bordered w-full h-12" name="dose_unit"><option value="мг">мг</option><option value="мл">мл</option><option value="таб">таб</option><option value="кап">кап</option></select></div></div><div class="form-control mb-4"><label class="label"><span class="label-text text-base font-medium">Расписание</span></label><input class="input input-bordered w-full h-12" name="schedule" placeholder="08:00, 20:00" type="text" /><label class="label"><span class="label-text-alt text-xs opacity-50">Время приёма через запятую</span></label></div><div class="form-control mb-4 flex-row items-center justify-between"><span class="text-base font-medium">Особо чувствительный</span><input class="toggle toggle-neutral" name="sensitive" type="checkbox" value="1" /></div><div class="form-control mb-4"><label class="label"><span class="label-text text-base font-medium">Заметки</span></label><textarea class="textarea textarea-bordered w-full" maxlength="500" name="notes" placeholder="Дополнительно..." rows="2"></textarea></div><div class="modal-action mt-6"><button class="btn btn-primary h-12 px-6" type="submit">Сохранить</button><button _="on click call #med-modal.close()" class="btn btn-ghost h-12" type="button">Отмена</button></div></form></div></body></html>
